name: release-app
on:
  workflow_dispatch:
    inputs:
      version_type:
        description: "Version bump"
        required: false
        default: "none"
        type: choice
        options:
          - none
          - major
          - minor
          - patch
      explicit_version:
        description: "Explicit version, overrides version_type"
        required: false
        type: string
      package_manager:
        description: "Package manager"
        required: false
        default: "npm"
        type: choice
        options:
          - npm
          - yarn
          - bun
          - pnpm
      check_command:
        description: "Check command, empty skips checks"
        required: false
        default: "check"
        type: string
      changelog_preset:
        description: "conventional-changelog preset, empty disables changelog"
        required: false
        default: "angular"
        type: string

jobs:
  release:
    uses: jenesei-software/.github/.github/workflows/release-app.yml@main
    with:
      version_type: ${{ inputs.version_type }}
      explicit_version: ${{ inputs.explicit_version }}
      package_manager: ${{ inputs.package_manager }}
      check_command: ${{ inputs.check_command }}
      changelog_preset: ${{ inputs.changelog_preset }}
    secrets:
      ACCESS_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}